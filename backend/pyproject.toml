[tool.poetry]
name = "singulari-news-backend"
version = "0.1.0"
description = "Singulari News backend API"
authors = ["João Furquim"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
tortoise-orm = ">=0.21.0"
aerich = ">=0.7.2"
asyncpg = ">=0.29.0"
pydantic = { version = ">=2.7.0", extras = ["email"] }
pydantic-settings = ">=2.3.0"
python-jose = { version = ">=3.3.0", extras = ["cryptography"] }
bcrypt = ">=4.1.0"
python-multipart = ">=0.0.9"
boto3 = ">=1.34.0"
resend = ">=2.0.0"
redis = ">=5.0.0"
anthropic = ">=0.28.0"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
aiosqlite = "^0.22.1"

[tool.poetry.group.lint.dependencies]
black = ">=24.0.0"
flake8 = ">=7.0.0"
isort = ">=5.13.0"
mypy = ">=1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.aerich]
tortoise_orm = "app.core.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
asyncio_mode = "auto"
